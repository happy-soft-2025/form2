<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>nova | user</title>

  <link rel="shortcut icon" href="./assets/favicon/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div class="box-form">
    <img src="./assets/icon/alvo.png" alt="icone do cadastro">
    <form action="" method="post" class="form-person" name="form-person" id="form-person">
      <input type="text"  name="name" id="name" placeholder="nome">
      <span id="warning-name" >digite um nome valido: </span>

      <input type="email" name="email" id="email" placeholder="exemplo@email.com">
       <span id="warning-email" >digite um nome valido: </span>

      <input type="text"  name="phone" id="phone" placeholder="(21) 999999999">
       <span id="warning-phone" >digite um nome valido: </span>

      <textarea rows="10"  name="description" id="description" placeholder="sua declaraçao formal"></textarea>
       <span id="warning-description" >digite um nome valido: </span>

      <button type="button" id="submitBt" class="submitBt" name="subimitBt">salvar</button>
    </form>
  </div>
  <script src="./assets/js/main.js"></script>
</body>
</html>
